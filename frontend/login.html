<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login | BuxMart</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- Your Main CSS -->
    <link rel="stylesheet" href="css/style.css" />

    <style>
      /* ==========================================
           LOGIN PAGE
        ========================================== */

      .login-section {
        min-height: calc(100vh - 84px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 60px 20px;
        background: #f7f9fc;
      }

      .login-container {
        width: 100%;
        max-width: 450px;
      }

      .login-card {
        background: #ffffff;
        border-radius: 22px;
        padding: 40px;
        box-shadow: 0 20px 60px rgba(16, 26, 47, 0.1);
        border: 1px solid #edf0f5;
      }

      .login-icon {
        width: 65px;
        height: 65px;
        border-radius: 18px;

        background: #2167e8;
        color: white;

        display: flex;
        align-items: center;
        justify-content: center;

        margin: 0 auto 18px;

        font-size: 28px;

        box-shadow: 0 10px 25px rgba(33, 103, 232, 0.2);
      }

      .login-title {
        text-align: center;
        font-size: 30px;
        font-weight: 750;
        color: #101a2f;
        margin-bottom: 8px;
      }

      .login-subtitle {
        text-align: center;
        color: #7b8495;
        font-size: 14px;
        margin-bottom: 30px;
      }

      .form-label {
        font-size: 13px;
        font-weight: 600;
        color: #172033;
        margin-bottom: 8px;
      }

      .input-wrapper {
        position: relative;
        margin-bottom: 20px;
      }

      .input-wrapper > i {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);

        color: #8c95a5;
        font-size: 17px;

        z-index: 2;
      }

      .login-input {
        width: 100%;
        height: 50px;

        border: 1px solid #dfe4ec;
        border-radius: 12px;

        background: #fafbfc;

        padding: 0 45px;

        outline: none;

        font-size: 14px;
        color: #172033;

        transition: 0.25s ease;
      }

      .login-input:focus {
        background: #fff;
        border-color: #2167e8;
        box-shadow: 0 0 0 3px rgba(33, 103, 232, 0.1);
      }

      .password-toggle {
        position: absolute;
        right: 14px;
        top: 50%;
        transform: translateY(-50%);

        border: none;
        background: transparent;

        color: #7b8495;

        font-size: 17px;

        cursor: pointer;

        z-index: 3;
      }

      .password-toggle:hover {
        color: #2167e8;
      }

      .login-options {
        display: flex;
        justify-content: space-between;
        align-items: center;

        margin-bottom: 24px;
      }

      .remember-me {
        display: flex;
        align-items: center;
        gap: 8px;

        color: #687386;
        font-size: 13px;
      }

      .remember-me input {
        width: 16px;
        height: 16px;
        accent-color: #2167e8;
      }

      .forgot-password {
        color: #2167e8;
        text-decoration: none;

        font-size: 13px;
        font-weight: 600;
      }

      .forgot-password:hover {
        color: #ff6b00;
      }

      .login-btn {
        width: 100%;
        height: 52px;

        border: none;
        border-radius: 12px;

        background: #2167e8;
        color: white;

        font-size: 15px;
        font-weight: 700;

        cursor: pointer;

        transition: 0.3s ease;
      }

      .login-btn:hover {
        background: #1858cc;
        transform: translateY(-2px);
      }

      .divider {
        display: flex;
        align-items: center;
        gap: 12px;

        margin: 25px 0;
      }

      .divider::before,
      .divider::after {
        content: "";
        height: 1px;
        background: #e5e9ef;
        flex: 1;
      }

      .divider span {
        color: #9aa2b1;
        font-size: 12px;
      }

      .google-btn {
        width: 100%;
        height: 50px;

        border: 1px solid #dfe4ec;
        border-radius: 12px;

        background: white;

        color: #172033;

        display: flex;
        align-items: center;
        justify-content: center;

        gap: 10px;

        font-size: 14px;
        font-weight: 600;

        cursor: pointer;

        transition: 0.25s ease;
      }

      .google-btn:hover {
        border-color: #2167e8;
        background: #f8faff;
      }

      .google-btn i {
        font-size: 18px;
      }

      .register-text {
        text-align: center;

        margin-top: 25px;
        margin-bottom: 0;

        color: #7b8495;
        font-size: 13px;
      }

      .register-text a {
        color: #2167e8;
        text-decoration: none;
        font-weight: 700;
      }

      .register-text a:hover {
        color: #ff6b00;
      }

      /* Message */

      .login-message {
        display: none;

        padding: 12px 14px;

        border-radius: 10px;

        margin-bottom: 20px;

        font-size: 13px;
      }

      .login-message.error {
        display: block;

        color: #c62828;
        background: #fff1f1;

        border: 1px solid #ffd5d5;
      }

      .login-message.success {
        display: block;

        color: #218838;
        background: #effaf3;

        border: 1px solid #ccebd5;
      }

      /* ==========================================
           BUXMART NAVBAR
        ========================================== */

      .main-navbar {
        background: #101a2f;
        min-height: 84px;

        color: white;

        border-bottom: 3px solid #edf0f5;

        position: sticky;
        top: 0;

        z-index: 1000;
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 10px;

        text-decoration: none;
      }

      .logo-icon {
        width: 43px;
        height: 43px;

        border-radius: 12px;

        background: #2167e8;
        color: white;

        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 21px;
      }

      .logo-text {
        display: flex;
        flex-direction: column;

        line-height: 1.1;
      }

      .store-name {
        font-size: 23px;
        font-weight: 750;

        color: #ff6b00;
      }

      .logo-text small {
        font-size: 11px;
        color: #7b8495;

        margin-top: 3px;
      }

      .navbar-nav {
        gap: 5px;
      }

      .nav-link {
        color: white !important;

        font-size: 14px;
        font-weight: 500;

        padding: 10px !important;

        position: relative;

        transition: 0.3s ease;
      }

      .nav-link:hover {
        color: #2167e8 !important;
      }

      .nav-link.active {
        color: #ff6b00 !important;
      }

      .nav-link.active::after {
        content: "";

        position: absolute;

        left: 9px;
        right: 9px;
        bottom: 0;

        height: 3px;

        border-radius: 10px 10px 0 0;

        background: #2167e8;
      }

      /* Search */

      .search-box {
        width: 245px;
        height: 43px;

        display: flex;
        align-items: center;

        border: 1px solid #e3e7ee;
        border-radius: 25px;

        background: #fafbfc;

        margin-left: 15px;
      }

      .search-box input {
        width: 100%;
        height: 100%;

        border: none;
        outline: none;

        background: transparent;

        padding: 0 8px 0 17px;

        font-size: 13px;
        color: #172033;
      }

      .search-box button {
        width: 42px;
        height: 42px;

        border: none;

        background: transparent;

        color: #273449;

        font-size: 17px;

        cursor: pointer;
      }

      /* Navbar actions */

      .navbar-actions {
        display: flex;
        align-items: center;

        gap: 8px;

        margin-left: 14px;
      }

      .action-icon {
        width: 39px;
        height: 39px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 50%;

        color: white;

        font-size: 20px;

        position: relative;

        transition: 0.3s ease;

        text-decoration: none;
      }

      .action-icon:hover {
        background: #ff6b00;
        color: white;

        transform: translateY(-2px);
      }

      .active-action {
        background: #ff6b00;
      }

      .cart-count {
        position: absolute;

        top: -3px;
        right: -2px;

        width: 18px;
        height: 18px;

        border-radius: 50%;

        background: #2167e8;

        color: white;

        font-size: 10px;
        font-weight: bold;

        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* ==========================================
           RESPONSIVE
        ========================================== */

      @media (max-width: 1199px) {
        .search-box {
          width: 190px;
        }

        .navbar-actions {
          margin-left: 5px;
        }
      }

      @media (max-width: 991px) {
        .main-navbar {
          padding: 12px 0;
        }

        .navbar-collapse {
          padding-top: 15px;
        }

        .navbar-nav {
          gap: 0;
        }

        .nav-link {
          padding: 11px 5px !important;
        }

        .nav-link.active::after {
          display: none;
        }

        .search-box {
          width: 100%;
          margin: 12px 0;
        }

        .navbar-actions {
          justify-content: center;
          margin: 8px 0 0;
        }
      }

      @media (max-width: 576px) {
        .login-section {
          padding: 35px 15px;
        }

        .login-card {
          padding: 30px 22px;
        }

        .login-title {
          font-size: 26px;
        }

        .login-options {
          gap: 10px;
        }
      }
    </style>
  </head>

  <body>
    <div class="top-bar">
      <div class="container">
        <div class="top-bar-content">
          <span>
            <i class="bi bi-truck"></i>
            Free delivery on orders over $50
          </span>

          <span class="welcome-text"> Welcome to ZAVORA Online Store </span>

          <span>
            <i class="bi bi-headset"></i>
            Need help? +92 309 3223281
          </span>
        </div>
      </div>
    </div>
    <!-- ==========================================
     NAVBAR
========================================== -->

    <nav class="navbar navbar-expand-lg main-navbar">
      <div class="container">
        <!-- Logo -->

        <a class="navbar-brand logo" href="index.html">
          <div class="logo-icon">
            <i class="bi bi-bag-heart-fill"></i>
          </div>

          <div class="logo-text">
            <span class="store-name"> ZAVORA </span>

            <small> Online Store </small>
          </div>
        </a>

        <!-- Mobile Menu -->

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNavbar"
        >
          <i class="bi bi-list"></i>
        </button>

        <!-- Navbar -->

        <div class="collapse navbar-collapse" id="mainNavbar">
          <ul class="navbar-nav mx-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html"> Home </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="products.html" id="shopLink"> Shop </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="about.html"> About Us </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="contact.html"> Contact </a>
            </li>
          </ul>

          <!-- Search -->

          <div class="search-box">
            <input
              type="text"
              id="homeSearch"
              placeholder="Search products..."
            />

            <button type="button" id="searchBtn">
              <i class="bi bi-search"></i>
            </button>
          </div>

          <!-- Navbar Actions -->

          <div class="navbar-actions">
            <!-- Account -->

            <a
              href="login.html"
              class="action-icon active-action"
              id="accountLink"
              aria-label="Account"
              title="Account"
            >
              <i class="bi bi-person"></i>
            </a>

            <!-- Wishlist -->

            <a
              href="wishlist.html"
              class="action-icon"
              id="wishlistNavBtn"
              aria-label="Wishlist"
            >
              <i class="bi bi-heart"></i>
            </a>

            <!-- Cart -->

            <a href="cart.html" class="action-icon cart-icon" aria-label="Cart">
              <i class="bi bi-cart3"></i>

              <span class="cart-count" id="cartCount"> 0 </span>
            </a>
          </div>
        </div>
      </div>
    </nav>

    <!-- ==========================================
     LOGIN
========================================== -->

    <section class="login-section">
      <div class="login-container">
        <div class="login-card">
          <!-- Login Icon -->

          <div class="login-icon">
            <i class="bi bi-person-fill"></i>
          </div>

          <h1 class="login-title">Welcome Back</h1>

          <p class="login-subtitle">Login to your BuxMart account</p>

          <!-- Message -->

          <div id="loginMessage" class="login-message"></div>

          <!-- Form -->

          <form id="loginForm">
            <!-- Email -->

            <label class="form-label" for="email"> Email Address </label>

            <div class="input-wrapper">
              <i class="bi bi-envelope"></i>

              <input
                type="email"
                id="email"
                class="login-input"
                placeholder="Enter your email"
                autocomplete="email"
                required
              />
            </div>

            <!-- Password -->

            <label class="form-label" for="password"> Password </label>

            <div class="input-wrapper">
              <i class="bi bi-lock"></i>

              <input
                type="password"
                id="password"
                class="login-input"
                placeholder="Enter your password"
                autocomplete="current-password"
                minlength="6"
                required
              />

              <button type="button" class="password-toggle" id="togglePassword">
                <i class="bi bi-eye"></i>
              </button>
            </div>

            <!-- Remember -->

            <div class="login-options">
              <label class="remember-me">
                <input type="checkbox" id="rememberMe" />

                Remember me
              </label>

              <a href="#" class="forgot-password" id="forgotPassword">
                Forgot Password?
              </a>
            </div>

            <!-- Login Button -->

            <button type="submit" class="login-btn" id="loginBtn">
              <span id="loginBtnText"> Login </span>
            </button>
          </form>

          <!-- Divider -->

          <div class="divider">
            <span> OR </span>
          </div>

          <!-- Google -->

          <button type="button" class="google-btn" id="googleLoginBtn">
            <i class="bi bi-google"></i>

            Continue with Google
          </button>

          <!-- Register -->

          <p class="register-text">
            Don't have an account?

            <a href="register.html"> Create Account </a>
          </p>
        </div>
      </div>
    </section>

    <!-- ==========================================
     BOOTSTRAP JS
========================================== -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- ==========================================
     MAIN JS
========================================== -->

    <script src="js/main.js"></script>

    <!-- ==========================================
     LOGIN JS
========================================== -->

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        /* ======================================
           ELEMENTS
        ====================================== */

        const loginForm = document.getElementById("loginForm");

        const emailInput = document.getElementById("email");

        const passwordInput = document.getElementById("password");

        const rememberMe = document.getElementById("rememberMe");

        const togglePassword = document.getElementById("togglePassword");

        const loginBtn = document.getElementById("loginBtn");

        const loginBtnText = document.getElementById("loginBtnText");

        const loginMessage = document.getElementById("loginMessage");

        /* ======================================
           LOAD REMEMBERED EMAIL
        ====================================== */

        const rememberedEmail = localStorage.getItem("buxmartRememberEmail");

        if (rememberedEmail) {
          emailInput.value = rememberedEmail;

          rememberMe.checked = true;
        }

        /* ======================================
           PASSWORD TOGGLE
        ====================================== */

        togglePassword.addEventListener("click", function () {
          if (passwordInput.type === "password") {
            passwordInput.type = "text";

            togglePassword.innerHTML = '<i class="bi bi-eye-slash"></i>';
          } else {
            passwordInput.type = "password";

            togglePassword.innerHTML = '<i class="bi bi-eye"></i>';
          }
        });

        /* ======================================
           SHOW MESSAGE
        ====================================== */

        function showMessage(message, type) {
          loginMessage.textContent = message;

          loginMessage.className = "login-message " + type;
        }

        /* ======================================
           GET SAFE REDIRECT
        ====================================== */

        function getRedirectPage() {
          const savedRedirect = localStorage.getItem("redirectAfterLogin");

          if (!savedRedirect) {
            return "index.html";
          }

          try {
            const url = new URL(savedRedirect, window.location.origin);

            /*
             * Security:
             * Only allow same-origin pages.
             */

            if (url.origin !== window.location.origin) {
              return "index.html";
            }

            const fileName = url.pathname.split("/").pop();

            if (!fileName || !fileName.endsWith(".html")) {
              return "index.html";
            }

            return fileName + url.search + url.hash;
          } catch (error) {
            return "index.html";
          }
        }

        /* ======================================
           LOGIN
        ====================================== */

        loginForm.addEventListener("submit", function (event) {
          event.preventDefault();

          const email = emailInput.value.trim();

          const password = passwordInput.value.trim();

          /* Validation */

          if (!email || !password) {
            showMessage("Please enter your email and password.", "error");

            return;
          }

          if (password.length < 6) {
            showMessage("Password must be at least 6 characters.", "error");

            return;
          }

          /* Button Loading */

          loginBtn.disabled = true;

          loginBtnText.innerHTML =
            '<i class="bi bi-arrow-repeat"></i> Logging in...';

          /*
           * DEMO LOGIN
           *
           * Later replace this section
           * with FastAPI authentication.
           */

          setTimeout(function () {
            /*
             * Generate temporary
             * display name from email.
             */

            let displayName = email.split("@")[0];

            displayName = displayName
              .replace(/[._-]/g, " ")
              .replace(/\b\w/g, function (letter) {
                return letter.toUpperCase();
              });

            /*
             * User object
             */

            const user = {
              name: displayName,

              email: email,

              loggedIn: true,

              loginMethod: "email",
            };

            /*
             * SAVE USER
             *
             * main.js avatar system
             * will use this user.
             */

            localStorage.setItem("buxmartUser", JSON.stringify(user));

            /*
             * REMEMBER EMAIL
             */

            if (rememberMe.checked) {
              localStorage.setItem("buxmartRememberEmail", email);
            } else {
              localStorage.removeItem("buxmartRememberEmail");
            }

            /*
             * SUCCESS
             */

            showMessage("Login successful! Redirecting...", "success");

            loginBtnText.innerHTML =
              '<i class="bi bi-check-circle"></i> Success';

            /*
             * GET ORIGINAL PAGE
             */

            const redirectPage = getRedirectPage();

            /*
             * Clear redirect
             */

            localStorage.removeItem("redirectAfterLogin");

            /*
             * Redirect
             */

            setTimeout(function () {
              window.location.href = redirectPage;
            }, 500);
          }, 700);
        });

        document
          .getElementById("forgotPassword")
          .addEventListener("click", function (event) {
            event.preventDefault();

            alert(
              "Password reset will be connected to the BuxMart FastAPI backend.",
            );
          });

        document
          .getElementById("googleLoginBtn")
          .addEventListener("click", function () {
            alert("Google Login will be connected to the BuxMart backend.");
          });
        const searchBtn = document.getElementById("searchBtn");

        const homeSearch = document.getElementById("homeSearch");

        if (searchBtn && homeSearch) {
          searchBtn.addEventListener("click", function () {
            const query = homeSearch.value.trim();

            if (!query) {
              return;
            }

            localStorage.setItem(
              "redirectAfterLogin",
              "products.html?search=" + encodeURIComponent(query),
            );

            window.location.href =
              "products.html?search=" + encodeURIComponent(query);
          });

          homeSearch.addEventListener("keydown", function (event) {
            if (event.key === "Enter") {
              searchBtn.click();
            }
          });
        }
      });
    </script>
  </body>
</html>
